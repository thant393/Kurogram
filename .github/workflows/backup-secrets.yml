name: Backup secrets (temporary)
# One-off recovery of the repository secrets, because GitHub never shows them again.
# This repository is PUBLIC and artifacts of public repositories can be downloaded by any signed-in GitHub user, so the
# result is a password-protected AES-256 zip (password = the BACKUP_PASSPHRASE secret), kept for 1 day.
# Delete this workflow, the run and the BACKUP_PASSPHRASE secret as soon as the zip is downloaded.
on:
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Pack into a password-protected zip
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          KEYSTORE_JKS: ${{ secrets.KEYSTORE_JKS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          STICKER_API_BASE_URL: ${{ secrets.STICKER_API_BASE_URL }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          set -e
          if [ "${#BACKUP_PASSPHRASE}" -lt 12 ]; then echo "::error::BACKUP_PASSPHRASE secret is missing or shorter than 12 characters"; exit 1; fi
          umask 077
          mkdir out
          if [ -n "$KEYSTORE_JKS" ]; then echo "$KEYSTORE_JKS" | base64 --decode > out/kurogram-release.jks; fi
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > out/signing.txt
          printf 'API_ID=%s\nAPI_HASH=%s\nMONGODB_URI=%s\nSTICKER_API_BASE_URL=%s\nTELEGRAM_SESSION_STRING=%s\n' "$API_ID" "$API_HASH" "$MONGODB_URI" "$STICKER_API_BASE_URL" "$TELEGRAM_SESSION_STRING" > out/other-secrets.txt
          if [ -s out/kurogram-release.jks ]; then
            keytool -list -keystore out/kurogram-release.jks -storepass "$KEYSTORE_PASSWORD" > out/keytool-check.txt 2>&1 || echo "keytool could not open it with KEYSTORE_PASSWORD" > out/keytool-check.txt
          fi
          cd out
          7z a -tzip -mem=AES256 -p"$BACKUP_PASSPHRASE" ../secrets-backup.zip . > /dev/null
          cd ..
          rm -rf out
          ls -l secrets-backup.zip
      - uses: actions/upload-artifact@v4
        with:
          name: secrets-backup-protected
          path: secrets-backup.zip
          retention-days: 1
