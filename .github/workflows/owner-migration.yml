name: Owner Migration
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (resolve and report only, write nothing)"
        type: boolean
        default: true
      refresh:
        description: "Also retry owners that were migrated without a display name"
        type: boolean
        default: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r Tools/sticker-scanner/requirements.txt
      - name: Migrate owner_telegram_id -> owner object
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.refresh }}" = "true" ]; then ARGS="$ARGS --refresh"; fi
          python3 Tools/sticker-scanner/migrate_owner_object.py $ARGS
